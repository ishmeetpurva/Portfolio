<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="600" viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .research-title { font-size: 18px; font-weight: 600; fill: #0f0f0f; }
      .research-stat { font-size: 32px; font-weight: 600; fill: #667eea; }
      .research-label { font-size: 13px; fill: #666; font-family: system-ui; }
      .method-box { stroke: #e0e0e0; stroke-width: 1; fill: #fafaf8; }
    </style>
  </defs>

  <rect width="1200" height="600" fill="#ffffff"/>

  <text x="600" y="50" text-anchor="middle" font-size="24" font-weight="600" fill="#0f0f0f" font-family="system-ui">Research Methodology</text>

  <!-- User Interviews -->
  <rect x="40" y="100" width="340" height="200" class="method-box" rx="8"/>
  <text x="210" y="140" text-anchor="middle" class="research-title">User Interviews</text>
  <text x="210" y="200" text-anchor="middle" class="research-stat">15+</text>
  <text x="210" y="230" text-anchor="middle" class="research-label">Face-to-face & remote interviews</text>
  <text x="210" y="255" text-anchor="middle" class="research-label">Uncovered user mental models in</text>
  <text x="210" y="275" text-anchor="middle" class="research-label">events/entertainment domain</text>

  <!-- Survey Research -->
  <rect x="430" y="100" width="340" height="200" class="method-box" rx="8"/>
  <text x="600" y="140" text-anchor="middle" class="research-title">Survey Analysis</text>
  <text x="600" y="200" text-anchor="middle" class="research-stat">150+</text>
  <text x="600" y="230" text-anchor="middle" class="research-label">Quantitative validation of findings</text>
  <text x="600" y="250" text-anchor="middle" class="research-label">Navigation pain points ranked</text>
  <text x="600" y="270" text-anchor="middle" class="research-label">Feature prioritization insights</text>
  <text x="600" y="290" text-anchor="middle" class="research-label">In-app survey responses</text>

  <!-- Behavioral Analytics -->
  <rect x="820" y="100" width="340" height="200" class="method-box" rx="8"/>
  <text x="990" y="140" text-anchor="middle" class="research-title">Behavioral Analytics</text>
  <text x="990" y="200" text-anchor="middle" class="research-stat">Hotjar</text>
  <text x="990" y="230" text-anchor="middle" class="research-label">Heatmap analysis identified</text>
  <text x="990" y="250" text-anchor="middle" class="research-label">homepage as drop-off bottleneck</text>
  <text x="990" y="270" text-anchor="middle" class="research-label">Session recordings revealed</text>
  <text x="990" y="290" text-anchor="middle" class="research-label">user confusion patterns</text>

  <!-- Key Finding -->
  <rect x="80" y="340" width="1040" height="220" fill="#f0f9ff" stroke="#3b82f6" stroke-width="2" rx="8"/>
  <text x="600" y="380" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af" font-family="system-ui">Key Finding: Information Overload</text>

  <text x="120" y="420" font-size="14" fill="#0f0f0f" font-family="system-ui">58% of new users dropped off before reaching the booking flow. Root causes:</text>

  <circle cx="150" cy="460" r="4" fill="#667eea"/>
  <text x="180" y="465" font-size="13" fill="#333" font-family="system-ui">Unclear information hierarchy overwhelming first-time users</text>

  <circle cx="150" cy="495" r="4" fill="#667eea"/>
  <text x="180" y="500" font-size="13" fill="#333" font-family="system-ui">Broken/confusing navigation flows with redundant content sections</text>

  <circle cx="150" cy="530" r="4" fill="#667eea"/>
  <text x="180" y="535" font-size="13" fill="#333" font-family="system-ui">Typography too small, CTAs unclear, no clear entry point for new users</text>
</svg>