<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="500" viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .category { font-size: 12px; font-weight: 600; fill: #999; font-family: system-ui; }
      .h1-demo { font-size: 32px; font-weight: 600; fill: #0f0f0f; font-family: system-ui; }
      .h2-demo { font-size: 24px; font-weight: 600; fill: #0f0f0f; font-family: system-ui; }
      .h3-demo { font-size: 18px; font-weight: 600; fill: #0f0f0f; font-family: system-ui; }
      .body-demo { font-size: 14px; fill: #333; font-family: system-ui; }
      .caption-demo { font-size: 12px; fill: #999; font-family: system-ui; }
    </style>
  </defs>

  <rect width="1000" height="500" fill="#ffffff"/>

  <text x="50" y="40" font-size="24" font-weight="600" fill="#0f0f0f" font-family="system-ui">Design System: Typography Scale</text>

  <!-- Column 1 -->
  <text x="50" y="90" class="category">HEADING 1</text>
  <text x="50" y="130" class="h1-demo">Trip Planner</text>
  <text x="50" y="155" font-size="11" fill="#999" font-family="system-ui">32px • Weight: 600 • Leading: 1.2</text>

  <text x="50" y="210" class="category">HEADING 2</text>
  <text x="50" y="250" class="h2-demo">Select Dates</text>
  <text x="50" y="275" font-size="11" fill="#999" font-family="system-ui">24px • Weight: 600 • Leading: 1.3</text>

  <!-- Column 2 -->
  <text x="520" y="90" class="category">HEADING 3</text>
  <text x="520" y="130" class="h3-demo">Choose Location</text>
  <text x="520" y="155" font-size="11" fill="#999" font-family="system-ui">18px • Weight: 600 • Leading: 1.4</text>

  <text x="520" y="210" class="category">BODY TEXT</text>
  <text x="520" y="240" class="body-demo">Plan group adventures together and</text>
  <text x="520" y="260" class="body-demo">create unforgettable memories. With</text>
  <text x="520" y="280" class="body-demo">real-time collaboration features.</text>
  <text x="520" y="305" font-size="11" fill="#999" font-family="system-ui">14px • Weight: 400 • Leading: 1.5</text>

  <text x="50" y="380" class="category">CAPTION</text>
  <text x="50" y="410" class="caption-demo">Optional subtitle or supporting text for secondary information</text>
  <text x="50" y="430" font-size="11" fill="#999" font-family="system-ui">12px • Weight: 400 • Color: #999</text>
</svg>