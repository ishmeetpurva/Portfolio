<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="400" viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .color-name { font-size: 14px; font-weight: 600; fill: #0f0f0f; font-family: system-ui; }
      .color-value { font-size: 12px; fill: #666; font-family: 'Monaco', monospace; }
    </style>
  </defs>

  <rect width="1000" height="400" fill="#ffffff"/>

  <text x="50" y="40" font-size="24" font-weight="600" fill="#0f0f0f" font-family="system-ui">Color Palette</text>

  <!-- Primary Brand Color -->
  <rect x="50" y="80" width="200" height="150" fill="#667eea" rx="8"/>
  <text x="150" y="175" text-anchor="middle" font-size="16" font-weight="600" fill="white" font-family="system-ui">Primary</text>
  <text x="150" y="245" text-anchor="middle" class="color-name">#667eea</text>
  <text x="150" y="270" text-anchor="middle" class="color-value">Brand Purple</text>

  <!-- Secondary Color -->
  <rect x="300" y="80" width="200" height="150" fill="#764ba2" rx="8"/>
  <text x="400" y="175" text-anchor="middle" font-size="16" font-weight="600" fill="white" font-family="system-ui">Secondary</text>
  <text x="400" y="245" text-anchor="middle" class="color-name">#764ba2</text>
  <text x="400" y="270" text-anchor="middle" class="color-value">Deep Purple</text>

  <!-- Neutral Dark -->
  <rect x="550" y="80" width="200" height="150" fill="#0f0f0f" rx="8"/>
  <text x="650" y="175" text-anchor="middle" font-size="16" font-weight="600" fill="white" font-family="system-ui">Neutral</text>
  <text x="650" y="245" text-anchor="middle" class="color-name" fill="white">#0f0f0f</text>
  <text x="650" y="270" text-anchor="middle" class="color-value" fill="#999">Charcoal Black</text>

  <!-- Neutral Light -->
  <rect x="800" y="80" width="150" height="150" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1" rx="8"/>
  <text x="875" y="175" text-anchor="middle" font-size="16" font-weight="600" fill="#0f0f0f" font-family="system-ui">Light</text>
  <text x="875" y="245" text-anchor="middle" class="color-name">#f5f5f5</text>
  <text x="875" y="270" text-anchor="middle" class="color-value">Off White</text>
</svg>