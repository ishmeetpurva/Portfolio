  <!-- Simplified Colonel silhouette as white initials -->
  <text x="50" y="64" font-family="'Arial Black', Impact, sans-serif" font-size="36" font-weight="900" fill="white" text-anchor="middle">KFC</text>
  <!-- KFC wordmark -->
  <text x="118" y="70" font-family="'Arial Black', Impact, sans-serif" font-size="66" font-weight="900" fill="#C8102E" text-anchor="start" letter-spacing="-2">KFC</text>
